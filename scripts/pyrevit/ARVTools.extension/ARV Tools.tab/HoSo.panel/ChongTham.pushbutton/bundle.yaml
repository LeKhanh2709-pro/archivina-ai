title: "Chống\nthấm"
tooltip: "Vẽ nét vén chân tường chống thấm (Detail Line) trên view mặt bằng chống thấm của Revit. Hatch chống thấm = Filled Region 2D trong view (người dùng chốt 2026-10-27: không đụng hatch / filter của sàn gạch model). - Nhận phòng ướt theo 2 nguồn: a) sàn hoàn thiện ướt trên level (tên kiểu sàn chứa từ khoá, vd. \"Gach Lat WC\", \"Gach Lat Logia\") b) bồn cầu / sen tắm / bồn tắm nằm ngoài mọi sàn ướt → WC ch Mặc định chạy thử (dry-run). Nguồn: ChongTham_VeVenChanTuong.dyn. TRẠNG THÁI: CHƯA DUYỆT."
author: Archivina BIM
