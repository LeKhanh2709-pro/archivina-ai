title: "Sàn căn hộ\ntừ CAD"
tooltip: "Tạo sàn hoàn thiện kiến trúc (Floor) cho phòng ngủ, phòng khách, WC, logia của các căn hộ trên level của view mặt bằng đang mở, lấy thông tin từ bản CAD mặt bằng đã Link (không cần đường bo phòng / hatch trong CAD): 1. Căn hộ  = polyline kín layer IN[1] (mặc định \"00 do dt\", > 20 m²); tên căn = TEXT/MTEXT layer IN[2] khớp mẫu IN[3] (mặc định CH01…), gán cho polyline gần nhất. Chữ đọc từ bản sao DW Mặc định chạy thử (dry-run). Nguồn: ARV_TaoSanCanHoTuCAD_v1.dyn. TRẠNG THÁI: CHƯA DUYỆT."
author: Archivina BIM
