title: "Cửa đi từ CAD"
tooltip: "Tạo cửa đi gắn vào tường Revit có sẵn từ mặt bằng DWG đã Link (cửa trong CAD là nét rời / block ẩn danh, nên nhận cửa theo CUNG MỞ CÁNH trên layer cửa): 1. Đọc cung tròn và cung elip (block cửa bị scale lệch) trên layer cửa (IN[1]): khoảng cách tâm → hai đầu cung 300–1500 mm, góc quét 30°–100° (cửa vẽ mở 90° hoặc 45°). Tâm cung = bản lề, khoảng cách tâm → đầu cung nằm dọc tường = bề rộng cánh. Cun Mặc định chạy thử (dry-run). Nguồn: ARV_TaoCuaTuCAD_v1.dyn. TRẠNG THÁI: CHƯA DUYỆT."
author: Archivina BIM
