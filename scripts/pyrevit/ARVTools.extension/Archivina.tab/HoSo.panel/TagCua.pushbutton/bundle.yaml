title: "Định vị\n+ tag cửa"
tooltip: "Bấm: hỏi đặt lên bản vẽ rồi vẽ luôn trên view mặt bằng đang mở (Ctrl+Z một lần là hoàn tác). Shift+bấm: hộp thoại đầy đủ, mặc định Dry-run. Tự động tag cửa đi + cửa sổ trên mặt bằng đang mở của Revit (người dùng chốt 2026-11-02; 2026-11-13 người dùng chốt \"Đổi cả Archivina\": tag AV-Tag-DOOR + cách xếp lại đã duyệt ở nút Hồ sơ đã duyệt): - Family tag: cửa đi \"AV-Tag-DOOR\" (family người dùng cấp, khung nhỏ chỉ mã Type Mark), cửa sổ \"AV-Ta Nguồn: TagCua_TuDong.dyn."
author: Archivina BIM
