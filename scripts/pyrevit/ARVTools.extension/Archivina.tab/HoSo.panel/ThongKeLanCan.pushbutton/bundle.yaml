title: "Thống kê\nlan can, louver"
tooltip: "Mở mặt bằng tầng rồi bấm: hiện bảng lan can / louver trong mặt bằng (cùng loại + cùng kích thước hiện 1 dòng): tên hiện tại (Mark), tên đổi, chiều dài, chiều cao, số lượng. Gõ tên mới (LK-…, LV-…) rồi bấm Đổi tên (đặt Mark, Ctrl+Z một lần là hoàn tác); tuỳ chọn tạo bảng thống kê Revit. Shift+bấm: hộp thoại đầy đủ, mặc định Dry-run. Nguồn: ThongKeLanCan_TuDong.dyn."
author: Archivina BIM
