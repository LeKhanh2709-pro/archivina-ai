title: "Chống\nthấm"
tooltip: "Bấm: vẽ luôn trên view chống thấm đang mở (không hộp thoại, Ctrl+Z một lần là hoàn tác). Shift+bấm: hộp thoại đầy đủ, mặc định Dry-run. Vẽ nét vén chân tường chống thấm (Detail Line) trên view mặt bằng chống thấm của Revit. Hatch chống thấm = Filled Region 2D trong view (người dùng chốt 2026-10-27: không đụng hatch / filter của sàn gạch model). - Nhận phòng ướt theo 2 nguồn: a) sàn hoàn thiện ướt trên level (tên kiểu sàn chứa từ kho Nguồn: ChongTham_VeVenChanTuong.dyn."
author: Archivina BIM
