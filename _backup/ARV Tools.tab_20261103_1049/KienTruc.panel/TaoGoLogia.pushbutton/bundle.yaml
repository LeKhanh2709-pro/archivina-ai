title: "Gờ\nlogia"
tooltip: "Tạo gờ bê tông mặt ngoài logia (Basic Wall), lấy tuyến từ mặt bằng DWG đã Link (KTS chốt 2026-10-21): 1. Logia = sàn (Floor) trên level IN[5] có tên type chứa IN[2] (VD \"SHT-Gach Lat Logia-300x600\"), lấy hộp bao. 2. Tuyến gờ = đường giữa cặp nét song song cách nhau 150 mm (± 3) trên layer IN[1], sát cạnh hộp bao logia (≤ 300 mm), phủ ≥ 50 % cạnh đó, dài từ tường đến tường (đầu nét CAD) – cùng cách Mặc định chạy thử (dry-run). Nguồn: ARV_TaoGoLogia_v1.dyn. TRẠNG THÁI: CHƯA DUYỆT."
author: Archivina BIM
