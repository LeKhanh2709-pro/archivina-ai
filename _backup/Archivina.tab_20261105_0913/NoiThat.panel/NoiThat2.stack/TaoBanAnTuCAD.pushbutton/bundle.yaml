title: "Bàn ăn từ CAD"
tooltip: "Đặt bàn ăn (Furniture 2D) trong phòng khách ăn từ mặt bằng DWG đã Link, NHẬN DIỆN THEO HÌNH DẠNG như tool 28 sofa (Revit gộp nét block vào một GeometryInstance nên không dùng tên block). 1. Bàn trên CAD, layer A-Nội thất / A-Interior = polyline chữ nhật kín, rộng 650…950, dài 1000…1600, có nét ghế ở CẢ HAI cạnh dài (G19: 700 × 1200 ghế tựa; 800 × 1200 ghế tròn). 2. Room chứa tâm bàn phải có tên ch Mặc định chạy thử (dry-run). Nguồn: ARV_TaoBanAnTuCAD_v1.dyn. TRẠNG THÁI: CHƯA DUYỆT."
author: Archivina BIM
