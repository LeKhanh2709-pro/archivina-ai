title: "Bàn làm việc"
tooltip: "Đặt bàn làm việc (Furniture 2D) trong phòng ngủ từ mặt bằng DWG đã Link, NHẬN DIỆN THEO HÌNH DẠNG như tool 22, 23 (Revit gộp nét block vào một GeometryInstance nên không dùng tên block). Tách từ phần bàn của tool 21. 1. Bàn trên CAD, layer A-Nội thất = hình chữ nhật sâu 450…650, dài 800…1700 có ghế cách cạnh dài ≤ 200 mm (lục giác 400 trên CAD, vào Revit tách thành chữ U 400 × 300 + nét rời). Lưng Mặc định chạy thử (dry-run). Nguồn: ARV_TaoBanLamViecTuCAD_v1.dyn. TRẠNG THÁI: CHƯA DUYỆT."
author: Archivina BIM
