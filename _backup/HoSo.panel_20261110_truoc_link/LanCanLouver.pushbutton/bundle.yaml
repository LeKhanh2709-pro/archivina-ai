title: "Định vị\nlan can, louver"
tooltip: "Mở mặt bằng tầng rồi bấm: hỏi đặt lên bản vẽ, rồi tạo / mở 'MẶT BẰNG ĐỊNH VỊ LAN CAN, LOUVER - <tầng>' và tag lan can / louver theo Mark (LK = lan can, LV = louver; Mark trống / sai tiền tố thì liệt kê, không tag), tag ngay giữa phía ngoài nhà, không đè, bấm lại không trùng; kèm bảng thống kê lan can / louver. Ctrl+Z một lần là hoàn tác. Shift+bấm: hộp thoại đầy đủ, mặc định Dry-run. Nguồn: LanCanLouver_TuDong.dyn."
author: Archivina BIM
