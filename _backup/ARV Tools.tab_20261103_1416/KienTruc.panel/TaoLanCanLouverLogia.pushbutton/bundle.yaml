title: "Lan can\nlouver logia"
tooltip: "Tạo lan can + louver che cục nóng điều hòa cho logia, lấy thông tin từ mặt bằng DWG đã Link (KTS chốt 2026-10-21): 1. Logia = sàn (Floor) trên level IN[9] có Comments \"ARV-SanCanHo <căn> LOGIA\" (tool 06) hoặc tên type chứa IN[2] (VD \"SHT-Gach Lat Logia-300x600\"), lấy hộp bao. Bỏ lớp trát gờ \"ARV-TratGoLogia\" (tool 12, type \"…Trát gờ logia\"). 2. Mặt ngoài logia = cặp nét song song cách nhau 150 mm  Mặc định chạy thử (dry-run). Nguồn: ARV_TaoLanCanLouverLogia_v1.dyn. TRẠNG THÁI: CHƯA DUYỆT."
author: Archivina BIM
