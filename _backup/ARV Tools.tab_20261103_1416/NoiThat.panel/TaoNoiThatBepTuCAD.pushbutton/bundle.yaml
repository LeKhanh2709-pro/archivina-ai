title: "Nội thất\nbếp"
tooltip: "Đặt nội thất khu bếp trong phòng khách ăn từ mặt bằng DWG đã Link, NHẬN DIỆN THEO HÌNH DẠNG như tool 22–25 (Revit gộp nét block vào một GeometryInstance nên không dùng tên block). Một tool cho cả khu bếp (người dùng chọn 2026-11-02) vì đá mặt tủ lấy theo biên tủ, bếp từ và chậu rửa nằm trên tủ. Để trống ô type của hạng mục nào thì bỏ hạng mục đó. 1. Tủ lạnh = hình chữ nhật sâu 500…750, dài 850…120 Mặc định chạy thử (dry-run). Nguồn: ARV_TaoNoiThatBepTuCAD_v1.dyn. TRẠNG THÁI: CHƯA DUYỆT."
author: Archivina BIM
