title: "Thống kê\ncửa"
tooltip: "Mở mặt bằng tầng rồi bấm: hiện bảng các loại cửa đi / cửa sổ trong mặt bằng (cửa trùng hiện 1 lần): tên hiện tại, tên đổi, chiều dài, chiều cao, số lượng. Gõ tên mới rồi bấm Đổi tên (đổi Type Mark, Ctrl+Z một lần là hoàn tác); tuỳ chọn tạo bảng thống kê Revit. Shift+bấm: hộp thoại đầy đủ, mặc định Dry-run. Nguồn: ThongKeCua_TuDong.dyn."
author: Archivina BIM
