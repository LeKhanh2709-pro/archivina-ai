title: "Định vị\n+ tag cửa"
tooltip: "Bấm: hỏi đặt lên bản vẽ rồi vẽ luôn trên view mặt bằng đang mở (Ctrl+Z một lần là hoàn tác). Shift+bấm: hộp thoại đầy đủ, mặc định Dry-run. Tự động tag cửa đi + cửa sổ trên mặt bằng đang mở của Revit (người dùng chốt 2026-11-02, sửa theo góp ý cùng ngày): - Cửa đi: family tag \"AV_Door Tag\"; cửa sổ: \"AV_Window Tag\"; cửa sổ có tên family / type chứa từ khoá lam: \"AV_Louver Tag\". Đối tượng có Type Comments \"Louver\" hoặc \"Cửa nhôm\" thì KHÔN Nguồn: TagCua_TuDong.dyn."
author: Archivina BIM
